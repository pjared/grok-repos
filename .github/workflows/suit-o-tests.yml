name: Suit-O tests

on:
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: windows-latest
    defaults:
      run:
        working-directory: suit-o-cs2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest

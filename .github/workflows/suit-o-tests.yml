name: Suit-O tests

on:
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: windows-latest
    defaults:
      run:
        working-directory: suit-o-cs2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest

  release:
    name: release
    needs: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cut the release
        working-directory: suit-o-cs2
        run: python -m suit_o.release --commit
      - name: Push the version and tag
        run: |
          git push origin HEAD:main
          git push origin --tags

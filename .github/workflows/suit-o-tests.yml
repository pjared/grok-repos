name: Suit-O tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: windows-latest
    defaults:
      run:
        working-directory: suit-o-cs2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest

  release:
    name: release
    needs: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cut the release
        id: cut
        working-directory: suit-o-cs2
        run: |
          python -m suit_o.release --commit | tee "$RUNNER_TEMP/cut.txt"
          if grep -q '^Tagged ' "$RUNNER_TEMP/cut.txt"; then
            echo "cut=true" >> "$GITHUB_OUTPUT"
          else
            echo "cut=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Push the version and tag
        if: steps.cut.outputs.cut == 'true'
        run: |
          git push origin HEAD:main
          git push origin --tags
      - name: Test the release commit
        if: steps.cut.outputs.cut == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run suit-o-tests.yml --ref main

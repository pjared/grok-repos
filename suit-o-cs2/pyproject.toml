[project]
name = "suit-o"
version = "1.0.0"
description = "Local Counter-Strike 2 companion that speaks in-character lines from Game State Integration."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "pyttsx3>=2.90",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
